name: Manual Release Build

on:
  # manual trigger
  workflow_dispatch:
    inputs:
      reason:
        description: 'Update application'
        required: true
        default: 'Manual Release'

jobs:
  build_signed_apk:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Setup Java environment (Standard for Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. SECURITY: Decode the Keystore from Secrets
      # We decode the Base64 string back into a file ONLY for this build session.
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.jks

      # 4. Build the Signed APK
      # We inject the passwords and file path as environment variables.
      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_FILE: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName=${{ inputs.tag_name }}

      # 5. Cleanup: Verify Key Removal (Optional but good practice)
      # The VM is destroyed anyway, but this is a "belt and suspenders" safety step.
      - name: Remove Keystore
        if: always() # Runs even if build fails
        run: rm -f app/release.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version_tag }}
          name: Release ${{ inputs.version_tag }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided automatically by GitHub